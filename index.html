<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ray-Ban Schach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px system-ui,sans-serif}main{max-width:590px;margin:auto;padding:20px}h1{font-size:1.5rem}#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;max-width:540px;border:3px solid #4b5563}.square{border:0;border-radius:0;min-width:0;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,7vw,57px);cursor:pointer;line-height:1}.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:4px solid #facc15;outline-offset:-4px}.piece-w{color:#fff;text-shadow:0 2px 2px #111,1px 0 #111,-1px 0 #111}.piece-b{color:#111827;text-shadow:0 1px #eee}button.action{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px;margin:5px 4px 5px 0;font-size:15px}button.action:disabled{opacity:.45}#status,#engineStatus,#recommendation{padding:9px 0}#moves{overflow-wrap:anywhere;color:#cbd5e1}.note{color:#fbbf24;font-size:.9rem;line-height:1.5}
</style></head><body><main><h1>♟️ Ray-Ban Schach</h1><p class="note">Browser-Prototyp: Noch keine Verbindung zur Brillenkamera oder zum Brillendisplay.</p><div id="board" role="group" aria-label="Schachbrett"></div><div id="status"></div><button class="action" id="analyze">Besten Zug berechnen</button><button class="action" id="computer">Gegen Computer: Aus</button><button class="action" id="reset">Neues Spiel</button><button class="action" id="undo">Zug zurück</button><button class="action" id="flip">Brett drehen</button><div id="engineStatus">Stockfish wird geladen …</div><div id="recommendation"></div><h2>Zugliste</h2><div id="moves">Noch keine Züge.</div><p class="note">Zum Bewegen erst eine Figur, dann das Zielfeld antippen. Analysehilfe nur in erlaubten Partien verwenden.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
const status=document.getElementById('status'),board=document.getElementById('board'),moves=document.getElementById('moves');
if(typeof Chess==='undefined'){status.textContent='Die Schachregeln konnten nicht geladen werden. Bitte Seite neu laden.';return}
const game=new Chess(),glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
let selected=null,flipped=false;
let engine=null,ready=false,busy=false,kind=null,fen=null,vs=false;
const info=document.getElementById('engineStatus');
const tip=document.getElementById('recommendation');
const analyze=document.getElementById('analyze');
const computer=document.getElementById('computer');
function send(c){if(engine)engine.postMessage(c)}
function search(k){
 if(!ready||busy||game.game_over())return;
 busy=true;kind=k;fen=game.fen();tip.textContent='Stockfish denkt …';
 send('position fen '+fen);send('go depth 10');
}
function initialize(){
 ready=false;analyze.disabled=true;computer.disabled=true;
 try{
 const u=URL.createObjectURL(new Blob(["importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js')"],{type:'text/javascript'}));
 engine=new Worker(u);URL.revokeObjectURL(u);
 engine.onerror=()=>{ready=false;busy=false;info.textContent='Stockfish konnte nicht geladen werden.'};
 engine.onmessage=e=>{
 const line=String(e.data);
 if(line.includes('uciok'))send('isready');
 if(line.includes('readyok')){ready=true;info.textContent='Stockfish bereit';analyze.disabled=false;computer.disabled=false}
 const m=line.match(/bestmove ([a-h][1-8][a-h][1-8][qrbn]?)/);
 if(m&&busy){
 const k=kind,old=fen;busy=false;kind=null;
 if(old!==game.fen())return;
 const u=m[1],obj={from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'};
 if(k==='play'){const move=game.move(obj);if(move){tip.textContent='Computer spielte: '+move.san;selected=null;draw()}}
 else {const clone=new Chess(game.fen()),move=clone.move(obj);tip.textContent='Empfohlener Zug: '+(move?move.san:u)}
 }
 };
 send('uci');
 }catch(e){info.textContent='Stockfish konnte nicht gestartet werden.'}
}
function cancel(){if(busy&&engine){engine.terminate();busy=false;kind=null;initialize()}}
analyze.onclick=()=>search('analyze');
computer.onclick=()=>{vs=!vs;computer.textContent='Gegen Computer: '+(vs?'An':'Aus');if(vs&&game.turn()==='b')search('play')};

function draw(){
board.replaceChildren();
const ranks=flipped?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1];
const files=flipped?'hgfedcba':'abcdefgh';
for(const rank of ranks){for(const file of files){
const sq=file+rank,p=game.get(sq),cell=document.createElement('button');
cell.type='button';cell.className='square '+(((files.indexOf(file)+ranks.indexOf(rank))%2===0)?'light':'dark')+(sq===selected?' selected':'');
cell.setAttribute('aria-label',sq+(p?' '+p.color+p.type:''));
if(p){const span=document.createElement('span');span.className='piece-'+p.color;span.textContent=glyph[p.color+p.type];cell.appendChild(span)}
cell.onclick=()=>choose(sq);board.appendChild(cell);
}}
let label=game.turn()==='w'?'Weiß am Zug':'Schwarz am Zug';
if(game.in_checkmate())label='Schachmatt!';else if(game.in_draw())label='Remis!';else if(game.in_check())label+=' – Schach!';
status.textContent=label;moves.textContent=game.pgn()||'Noch keine Züge.';
}
function choose(sq){
if(game.game_over()||busy||(vs&&game.turn()==='b'))return;
const p=game.get(sq);
if(!selected){if(p&&p.color===game.turn())selected=sq;draw();return}
if(sq===selected){selected=null;draw();return}
const m=game.move({from:selected,to:sq,promotion:'q'});
if(m){selected=null;tip.textContent='';if(vs&&game.turn()==='b')search('play')}else if(p&&p.color===game.turn()){selected=sq}else{selected=null}
draw();
}
document.getElementById('reset').onclick=()=>{cancel();game.reset();selected=null;tip.textContent='';draw()};
document.getElementById('undo').onclick=()=>{cancel();game.undo();if(vs&&game.turn()==='b')game.undo();selected=null;tip.textContent='';draw()};
document.getElementById('flip').onclick=()=>{flipped=!flipped;selected=null;draw()};
draw();initialize();
})();
</script></body></html>
